# /etc/nginx/sites-available/api.crixaa.com
# Reverse proxy for the Crixaa backend (Docker container on 127.0.0.1:9092):
# HTTP REST, WebSocket (STOMP @ /ws), and SSE (AI generate).
#
# HTTP-only on purpose. Deploy, then let certbot add TLS:
#   sudo cp deploy/nginx/api.crixaa.com.conf /etc/nginx/sites-available/api.crixaa.com
#   sudo ln -s /etc/nginx/sites-available/api.crixaa.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.crixaa.com
# certbot clones this server block into a 443 block, fills in the cert paths,
# and adds the HTTP->HTTPS redirect. Do NOT add ssl_* directives here yourself.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream crixaa_backend {
    server 127.0.0.1:9092;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.crixaa.com;

    # Security headers (certbot copies these into the TLS block it generates;
    # HSTS is only honored over HTTPS, which is where the clone serves).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;   # NB: Spring caps multipart at 3MB — raise it there too
    client_body_timeout  120s;
    server_tokens off;

    access_log /var/log/nginx/api.crixaa.com.access.log;
    error_log  /var/log/nginx/api.crixaa.com.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain text/css
               text/xml application/xml application/xhtml+xml;

    # ---------------------- Shared proxy settings --------------------------
    # Defined ONCE and inherited by every location (no location sets its own
    # proxy_set_header, which would otherwise discard this whole set).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ------------------------- WebSocket (STOMP @ /ws) ---------------------
    location /ws {
        proxy_pass http://crixaa_backend;
        proxy_buffering off;
        proxy_read_timeout    3600s;   # allow idle WS up to 1h (app sends heartbeats)
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ------------- AI endpoints: SSE stream + long DeepSeek calls ----------
    # POST /api/templates/<id>/ai-generate streams SSE (SseEmitter = 30 min);
    # ai-fix-layout / ai-outline / ai-clarify are JSON but can exceed 2 min.
    # Regex location — takes precedence over the "/" prefix match below.
    location ~ ^/api/templates/[^/]+/ai- {
        proxy_pass http://crixaa_backend;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout    1200s;
        proxy_send_timeout    1200s;
        proxy_connect_timeout 10s;
    }

    # ------------------------- Health check --------------------------------
    location /actuator/health {
        proxy_pass http://crixaa_backend;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;      # adjust to your VPC CIDR
        deny all;
    }

    # Block the rest of actuator entirely.
    location /actuator {
        deny all;
    }

    # ---------------------------- REST API ---------------------------------
    location / {
        proxy_pass http://crixaa_backend;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffer_size       16k;
        proxy_buffers        8  16k;
        proxy_busy_buffers_size 32k;
    }
}
