spring:
  application:
    name: agreemint-backend
  datasource:
    # DB_NAME is a proper env — Aiven's default is "defaultdb", a fresh self-hosted
    # Postgres is usually "agreemint". Fall back to "agreemint" when unset so local
    # dev keeps working. SPRING_DATASOURCE_URL (if set by the Makefile) still
    # overrides this whole URL.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:agreemint}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      # We only use StringRedisTemplate directly (no RedisRepository subclasses),
      # so skip the scan that logs "Could not safely identify store assignment..."
      # for every JPA repository at startup.
      repositories:
        enabled: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    check-template-location: false
  servlet:
    multipart:
      # Avatar uploads — keep well under R2's 5 GB object limit; this is the
      # enforced ceiling per upload and matches the validation in AvatarController.
      max-file-size: 3MB
      max-request-size: 3MB
  mvc:
    async:
      # Spring's async-request-timeout is what tears down our SseEmitter
      # mid-stream — when it fires, the worker thread keeps trying to
      # emitter.send() and crashes with "ResponseBodyEmitter has already
      # completed". The AI generate flow can run 5–10 minutes on V4-Pro
      # for long documents; allow the SseEmitter's own 600s cap (set in
      # AiGenerateController) to be the authoritative timeout instead.
      # 0 disables Spring's outer timer; the per-emitter timeout still
      # protects against truly hung streams.
      request-timeout: 0

agreemint:
  storage:
    root: ${user.home}/.agreemint/storage
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  email:
    from-address: ${EMAIL_FROM:noreply@agreemint.com}
    from-name: ${EMAIL_FROM_NAME:Crixaa}
    # Transactional email is delivered via the Resend HTTP API (see EmailService).
    # The from-address domain above must be verified in your Resend account.
    # Leave RESEND_API_KEY empty in dev to log-and-skip sends instead of failing.
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  features:
    # Pixel-parity renderer — on by default since phase 5. Kept as an env-var
    # kill-switch for 6 months post-launch per the risk register; set
    # FEATURE_PIXEL_PARITY=false to fall back to the legacy path without a
    # deploy. Legacy code paths stay in place until the kill-switch window
    # expires; only then can the flag + legacy branches be removed.
    pixel-parity:
      enabled: ${FEATURE_PIXEL_PARITY:true}
  otp:
    length: 6
    ttl-minutes: 10
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-secure-256-bit-key-in-production-at-least-32-chars}
    access-token-expiry-minutes: 60
    refresh-token-expiry-days: 30
  # DeepSeek-driven template generation. The frontend's "magic wand" tool
  # opens a modal that POSTs an instruction here; the backend proxies to
  # DeepSeek and streams the response back as SSE so the editor never
  # touches the API key. Set DEEPSEEK_API_KEY in the env to enable; with
  # an empty key the endpoint returns 503.
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      # deepseek-v4-pro is the highest-quality model (1M-token context,
      # 384K max output, ~5× cost vs Flash). We default to Pro because
      # template generation on Flash kept emitting glued words and broken
      # Unicode escapes on long documents — Pro's tighter
      # instruction-following pays for itself in fewer Fix-Layout passes.
      # Override to deepseek-v4-flash via env if cost matters more than
      # quality. Legacy deepseek-chat / deepseek-reasoner names retire
      # July 2026 and now route to V4-Flash compatibility.
      model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
      timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:1200}
  oauth:
    google-enabled: ${OAUTH_GOOGLE_ENABLED:false}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    github-enabled: ${OAUTH_GITHUB_ENABLED:false}
    github-client-id: ${GITHUB_CLIENT_ID:}
    github-client-secret: ${GITHUB_CLIENT_SECRET:}
  # Developer platform — Phase 2 (Bucket4j) reads these. Redis host/port/password
  # come from the existing spring.data.redis.* above (REDIS_HOST / REDIS_PORT /
  # REDIS_PASSWORD); no new connection envs are needed.
  ratelimit:
    org-daily-max: ${RATELIMIT_ORG_DAILY_MAX:10000}
  # Razorpay subscription billing. Amounts, currency and billing interval live
  # on the Razorpay Plan itself, so only the plan ids appear here — changing a
  # price is a dashboard action plus a new plan id, not a deploy.
  # With an empty key-id the billing endpoints return 503 and the console hides
  # the upgrade UI, so a dev environment without credentials still works.
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    # Set on the webhook in the Razorpay dashboard — a DIFFERENT value from the
    # API key secret. Without it webhooks are rejected rather than trusted.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
    plan-starter-monthly: ${RAZORPAY_PLAN_STARTER_MONTHLY:}
    plan-starter-yearly: ${RAZORPAY_PLAN_STARTER_YEARLY:}
    plan-pro-monthly: ${RAZORPAY_PLAN_PRO_MONTHLY:}
    plan-pro-yearly: ${RAZORPAY_PLAN_PRO_YEARLY:}

  # Per-plan ceilings (agreemint.plans.*) are deliberately NOT declared here.
  #
  # They must default to null, meaning "no plan-specific limit", which preserves
  # today's behaviour where every org falls back to ratelimit.org-daily-max.
  # A YAML placeholder cannot express that: `${VAR:}` binds an empty string and
  # `${VAR:#{null}}` is not valid inside a property default — Spring treats the
  # `#{null}` as a literal and fails to parse it as an Integer.
  #
  # Leaving them undeclared lets the null defaults on PlanLimitsProperties
  # stand. To set one, use Spring's relaxed binding via the environment:
  #   AGREEMINT_PLANS_FREE_API_DAILY_MAX=500
  #   AGREEMINT_PLANS_PRO_API_DAILY_MAX=10000
  #   AGREEMINT_PLANS_FREE_PDF_DAILY_MAX=100
  # Setting these throttles existing customers — decide the commercial limits
  # first.

  # Free-plan limits. DISABLED unless free.restrictions-from is set: these take
  # away capability free workspaces have had since launch, so switching them on
  # is an explicit act. Set it to the instant the new terms start applying;
  # every workspace created BEFORE that keeps the old behaviour permanently.
  #   AGREEMINT_FREE_RESTRICTIONS_FROM=2026-08-01T00:00:00Z
  free:
    restrictions-from: ${FREE_RESTRICTIONS_FROM:}
    max-templates: ${FREE_MAX_TEMPLATES:10}
    max-workspaces: ${FREE_MAX_WORKSPACES:1}

  # Document expiry. `expires_at` has existed since V11 but nothing wrote it
  # until the PUT /api/documents/{id}/expiry endpoint landed, so the hourly
  # auto-expire sweep had never matched a row.
  #
  # The warning sweep is separate and daily: it looks `lead-days` ahead and
  # emails once per document, tracked by generated_documents.expiry_warned_at
  # (V24). Raising lead-days re-warns nothing — the marker is only cleared when
  # a document's date actually changes.
  documents:
    expiry-warning-lead-days: ${DOCUMENT_EXPIRY_WARNING_LEAD_DAYS:7}
    expiry-warning-batch-size: ${DOCUMENT_EXPIRY_WARNING_BATCH_SIZE:500}
    expiry-warning-cron: ${DOCUMENT_EXPIRY_WARNING_CRON:0 15 9 * * *}

  # Developer platform — Phase 6 (API key expiry warnings). Quartz-style cron.
  # Default fires every day at 09:00 local time of the backend host.
  api-keys:
    expiry-warning-cron: ${API_KEY_EXPIRY_WARNING_CRON:0 0 9 * * *}
  # Cloudflare R2 (S3-compatible) object storage — used for generated PDFs
  # (private bucket, accessed via short-TTL presigned URLs) and user/org
  # avatars (public bucket, URL stored in users.avatar_url /
  # organizations.logo_url). Leave blank to run the old in-memory/local
  # behaviour during development, but PDF + avatar endpoints will 500
  # until these are filled in.
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-documents: ${R2_BUCKET_DOCUMENTS:agreemint-documents}
    bucket-public: ${R2_BUCKET_PUBLIC:agreemint-public}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    presign-ttl-minutes: ${R2_PRESIGN_TTL_MINUTES:5}

server:
  port: ${PORT}
  # Behind the nginx reverse proxy (see deploy/nginx/api.crixaa.com.conf), honor
  # the X-Forwarded-* headers it sets so the app knows it's served over HTTPS —
  # correct absolute URLs, OAuth2 redirect URIs, and client IPs. Without this
  # Spring ignores those headers and thinks every request is plain HTTP.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
