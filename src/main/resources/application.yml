spring:
  application:
    name: agreemint-backend
  datasource:
    # DB_NAME is a proper env — Aiven's default is "defaultdb", a fresh self-hosted
    # Postgres is usually "agreemint". Fall back to "agreemint" when unset so local
    # dev keeps working. SPRING_DATASOURCE_URL (if set by the Makefile) still
    # overrides this whole URL.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:agreemint}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      # We only use StringRedisTemplate directly (no RedisRepository subclasses),
      # so skip the scan that logs "Could not safely identify store assignment..."
      # for every JPA repository at startup.
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    check-template-location: false
  servlet:
    multipart:
      # Avatar uploads — keep well under R2's 5 GB object limit; this is the
      # enforced ceiling per upload and matches the validation in AvatarController.
      max-file-size: 3MB
      max-request-size: 3MB

agreemint:
  storage:
    root: ${user.home}/.agreemint/storage
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  email:
    from-address: ${EMAIL_FROM:noreply@agreemint.com}
    from-name: ${EMAIL_FROM_NAME:Crixaa}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  otp:
    length: 6
    ttl-minutes: 10
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-secure-256-bit-key-in-production-at-least-32-chars}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  oauth:
    google-enabled: ${OAUTH_GOOGLE_ENABLED:false}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    github-enabled: ${OAUTH_GITHUB_ENABLED:false}
    github-client-id: ${GITHUB_CLIENT_ID:}
    github-client-secret: ${GITHUB_CLIENT_SECRET:}
  # Developer platform — Phase 2 (Bucket4j) reads these. Redis host/port/password
  # come from the existing spring.data.redis.* above (REDIS_HOST / REDIS_PORT /
  # REDIS_PASSWORD); no new connection envs are needed.
  ratelimit:
    org-daily-max: ${RATELIMIT_ORG_DAILY_MAX:10000}
  # Developer platform — Phase 6 (API key expiry warnings). Quartz-style cron.
  # Default fires every day at 09:00 local time of the backend host.
  api-keys:
    expiry-warning-cron: ${API_KEY_EXPIRY_WARNING_CRON:0 0 9 * * *}
  # Cloudflare R2 (S3-compatible) object storage — used for generated PDFs
  # (private bucket, accessed via short-TTL presigned URLs) and user/org
  # avatars (public bucket, URL stored in users.avatar_url /
  # organizations.logo_url). Leave blank to run the old in-memory/local
  # behaviour during development, but PDF + avatar endpoints will 500
  # until these are filled in.
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-documents: ${R2_BUCKET_DOCUMENTS:agreemint-documents}
    bucket-public: ${R2_BUCKET_PUBLIC:agreemint-public}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    presign-ttl-minutes: ${R2_PRESIGN_TTL_MINUTES:5}

server:
  port: ${PORT}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
