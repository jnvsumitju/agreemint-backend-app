spring:
  application:
    name: agreemint-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/agreemint
    username: app
    password: Sumit@3745
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

agreemint:
  storage:
    root: ${user.home}/.agreemint/storage
  cors:
    origins: http://localhost:5173,http://127.0.0.1:5173

server:
  port: 8080
