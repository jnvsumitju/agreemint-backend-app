# H2 for local dev without PostgreSQL — activate with: spring.profiles.active=dev
spring:
  datasource:
    url: jdbc:h2:mem:agreemint;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

agreemint:
  storage:
    root: ${java.io.tmpdir}/agreemint-storage

logging:
  level:
    com.agreemint.pdf: DEBUG
